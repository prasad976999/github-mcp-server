[project]
name = "github-mcp-server"
version = "0.1.0"
description = "An MCP server that lets AI assistants explore and work with GitHub repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.28",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
github-mcp = "github_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["github_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (real bugs), I: import order, B: bugbear (likely bugs),
# UP: modern Python syntax, SIM: simpler code.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
